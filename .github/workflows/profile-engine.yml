name: Navidix Animated Profile Engine

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'assets/brand/**'
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  compile-svg-stages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NavidixStudio Profile
        uses: actions/checkout@v4

      - name: Compile & XML-Validate Animated SVG Stages
        shell: pwsh
        run: ./scripts/build-profile.ps1

      - name: Commit Updated SVG Stages (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): recompile animated SVG telemetry stages"
            git push
          fi
